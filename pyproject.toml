[project]
name = "brynz"
version = "0.1.0"
description = "CPU-first room capture geometry and evidence pipeline"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<5",
  "matplotlib>=3.9,<4",
  "jsonschema>=4.23,<5",
  "scikit-image>=0.25,<1",
  "shapely>=2.0,<3",
  "markdown-it-py>=3,<5",
]

[project.scripts]
brynz = "brynz.cli:main"

[project.optional-dependencies]
rgb = ["pycolmap>=3.13,<5", "torch>=2.6,<3", "transformers>=4.45,<5", "huggingface-hub>=0.28,<1", "pillow-heif>=0.20"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
